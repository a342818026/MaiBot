name: build-pet-client-android
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: sdk components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: gradle assembleDebug
        working-directory: pet-clients/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: pet-client-android
          path: pet-clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
