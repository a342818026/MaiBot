name: build-pet-client-win
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pet-clients/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet-clients/desktop/src-tauri -> target

      - name: npm ci
        working-directory: pet-clients/desktop
        run: npm ci

      - name: tauri build
        working-directory: pet-clients/desktop
        run: npm run dist:win

      - name: collect artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.exe,*.msi pet-clients/desktop/src-tauri/target/release/bundle | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: pet-client-win
          path: |
            pet-clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
            pet-clients/desktop/src-tauri/target/release/bundle/msi/*.msi
            pet-clients/desktop/dist/desktop-pet-client/**
          if-no-files-found: error
          retention-days: 14
